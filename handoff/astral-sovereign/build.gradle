plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

def metadata = [
        'mod_id', 'mod_name', 'mod_license', 'mod_version', 'mod_authors', 'mod_description',
        'minecraft_version_range', 'neo_version_range', 'loader_version_range'
].collectEntries { key -> [(key): providers.gradleProperty(key).get()] }

group = providers.gradleProperty('mod_group_id').get()
version = metadata.mod_version
base.archivesName = metadata.mod_id

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = providers.gradleProperty('neo_version').get()
    mods {
        register(metadata.mod_id) {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('processResources', ProcessResources) {
    inputs.properties(metadata)
    filesMatching('META-INF/neoforge.mods.toml') { expand(metadata) }
}
