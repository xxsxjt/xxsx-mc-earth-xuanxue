plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '0.9.4'
group = 'com.xxsx.earth.xuanxue'
base.archivesName = 'earth-xuanxue-neoforge-26.1.2'

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = '26.1.2.124'

    runs {
        client {
            client()
            gameDirectory = project.file('runs/client')
        }
        server {
            server()
            gameDirectory = project.file('runs/server')
            programArgument('--nogui')
        }
    }

    mods {
        earth_xuanxue {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven {
        url = uri('https://maven.blamejared.com')
        content {
            includeGroup 'mezz.jei'
        }
    }
    mavenCentral()
}

dependencies {
    def earthCoreJar = providers.gradleProperty('earthCoreJar').orElse('/app/applet/deliverables/earth-core-neoforge-26.1.2-beta.jar').get()
    implementation files(earthCoreJar)
    testImplementation files(earthCoreJar)
    def earthLoreJar = providers.gradleProperty('earthLoreJar').orElse('/tmp/earth-unify/xxsx-mc-earth-lore/neoforge-26.1.2/build/libs/earth-lore-neoforge-26.1.2-beta.jar').get()
    compileOnly files(earthLoreJar)
    testImplementation files(earthLoreJar)
    compileOnly 'mezz.jei:jei-26.1.2-common-api:29.53.0.112'
    compileOnly 'mezz.jei:jei-26.1.2-neoforge-api:29.53.0.112'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

configurations {
    testCompileClasspath.extendsFrom compileClasspath
    testRuntimeClasspath.extendsFrom runtimeClasspath
}

jar {
    // Pre-1.0 unified beta JAR filename (no changing digits); internal mod version stays in project.version / neoforge.mods.toml
    archiveFileName = "${base.archivesName.get()}-beta.jar"
    from('../LICENSE') {
        into 'META-INF'
    }
    manifest {
        attributes([
            'Specification-Title'     : 'Earth: Xuanxue',
            'Specification-Vendor'    : 'xxsx',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.version,
            'Implementation-Vendor'   : 'xxsx',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('verifyArcanaBalance', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.xxsx.earth.xuanxue.ArcanaBalanceRegression'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    failOnNoDiscoveredTests = false
}

tasks.named('check') {
    dependsOn verifyArcanaBalance
}

// Compile-only Inventory Profiles Next (IPN) API stubs (NEVER packaged into output mod JAR)
sourceSets {
    ipnApi {
        java.srcDir 'src/ipnApi/java'
    }
}

dependencies {
    compileOnly sourceSets.ipnApi.output
    testCompileOnly sourceSets.ipnApi.output
    testRuntimeOnly sourceSets.ipnApi.output
}
